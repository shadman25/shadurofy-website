<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Admin Login | Shad-Urofy</title><link rel="stylesheet" href="../css/style.css"><style>body{min-height:100vh;display:grid;place-items:center}.login{width:min(430px,92%);background:#fff;border:1px solid #e3eaee;border-radius:20px;padding:36px;box-shadow:0 20px 50px rgba(20,40,50,.08)}.login h1{margin:4px 0 8px}.login p{color:#68757d}.login label{display:block;font-weight:700;margin:16px 0}.login input{margin-top:6px}.error{color:#b42318;font-size:14px;margin:10px 0}</style></head>
<body><div class="login"><a class="brand" href="../index.html"><span>SHAD</span>-UROFY</a><h1>Admin Login</h1><p>Sign in with the Supabase Auth account created for your administrator.</p><form id="loginForm"><label>Email<input id="email" type="email" required autocomplete="username"></label><label>Password<input id="password" type="password" required autocomplete="current-password"></label><div id="error" class="error"></div><button class="btn primary" type="submit" id="loginBtn">Login</button></form><p><a href="../index.html">← Back to website</a></p></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/supabase.js"></script>
<script>
const form=document.getElementById("loginForm"),errorEl=document.getElementById("error"),btn=document.getElementById("loginBtn");
(async()=>{const {data}=await supabaseClient.auth.getSession();if(data.session)location.href="dashboard.html";})();
form.addEventListener("submit",async e=>{e.preventDefault();errorEl.textContent="";btn.disabled=true;btn.textContent="Signing in...";
 const {error}=await supabaseClient.auth.signInWithPassword({email:document.getElementById("email").value.trim(),password:document.getElementById("password").value});
 if(error){errorEl.textContent=error.message;btn.disabled=false;btn.textContent="Login";return;}
 location.href="dashboard.html";
});
</script></body></html>
