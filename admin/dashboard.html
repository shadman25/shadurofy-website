<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Dashboard | Shad-Urofy</title><link rel="stylesheet" href="../css/style.css"><style>.admin-wrap{padding:55px 0}.dash-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px;gap:20px}.dash-head h1{margin:0;font-size:36px}.admin-actions{display:flex;gap:10px}.table-wrap{background:white;border:1px solid #e3eaee;border-radius:16px;overflow:auto}.admin-table{width:100%;border-collapse:collapse;min-width:850px}.admin-table th,.admin-table td{padding:15px 18px;text-align:left;border-bottom:1px solid #e9eef1}.admin-table th{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:#66747d}.status{font-size:12px;font-weight:800;padding:5px 9px;border-radius:20px;background:#e7f7f3;color:#147766}.hidden{background:#f7eeee;color:#b42318}.action-btn{border:1px solid #d9e3e8;background:#fff;padding:7px 10px;border-radius:7px;cursor:pointer}.danger{color:#b42318}.modal{display:none;position:fixed;inset:0;background:rgba(10,20,25,.45);place-items:center;padding:20px}.modal.open{display:grid}.modal-box{width:min(650px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:18px;padding:28px}.modal-box h2{margin-top:0}.modal-box label{display:block;font-weight:700;margin:12px 0}.modal-box input,.modal-box textarea,.modal-box select{margin-top:5px;width:100%;box-sizing:border-box}.check{display:flex!important;align-items:center;gap:8px}.check input{width:auto!important;margin:0}.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}.message{margin:12px 0;color:#b42318}.loading{padding:25px}</style></head>
<body>
<header class="site-header"><div class="container nav"><a class="brand" href="../index.html"><span>SHAD</span>-UROFY</a><nav><a href="../index.html">View Website</a><a href="#" id="logout">Logout</a></nav></div></header>
<main class="admin-wrap"><div class="container"><div class="dash-head"><div><p class="eyebrow">ADMIN PANEL</p><h1>Products</h1></div><div class="admin-actions"><button class="btn primary" id="addBtn">+ Add Product</button></div></div><div id="message" class="message"></div><div class="table-wrap"><table class="admin-table"><thead><tr><th>Product</th><th>Category</th><th>Brand / Model</th><th>Status</th><th>Featured</th><th>Actions</th></tr></thead><tbody id="rows"><tr><td colspan="6" class="loading">Loading...</td></tr></tbody></table></div></div></main>
<div class="modal" id="modal"><div class="modal-box"><h2 id="modalTitle">Add Product</h2><form id="productForm"><input id="productId" type="hidden"><label>Product Name<input id="name" required></label><label>Slug<input id="slug" placeholder="auto-generated-if-empty"></label><label>Category<select id="categoryId" required><option value="">Select category</option></select></label><label>Brand<input id="brand"></label><label>Model<input id="model"></label><label>Image URL<input id="imageUrl" type="url" placeholder="https://..."></label><label>Description<textarea id="description" rows="4"></textarea></label><label>Specifications (JSON)<textarea id="specifications" rows="5" placeholder='{"key":"value"}'></textarea></label><label class="check"><input id="featured" type="checkbox"> Featured</label><label class="check"><input id="active" type="checkbox" checked> Active / visible</label><div class="modal-actions"><button type="button" class="btn secondary" id="cancelBtn">Cancel</button><button class="btn primary" type="submit" id="saveBtn">Save Product</button></div></form></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/supabase.js"></script>
<script>
let products=[],categories=[];
const $=id=>document.getElementById(id);
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}
function slugify(s){return String(s||"").toLowerCase().trim().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"");}
function showError(msg){$("message").textContent=msg||"";}
async function requireSession(){const {data}=await supabaseClient.auth.getSession();if(!data.session){location.href="login.html";return false;}return true;}
async function loadCategories(){const {data,error}=await supabaseClient.from("categories").select("id,name,slug").order("name");if(error)throw error;categories=data||[];$("categoryId").innerHTML='<option value="">Select category</option>'+categories.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join("");}
async function loadProducts(){const {data,error}=await supabaseClient.from("products").select("id,created_at,updated_at,category_id,name,slug,description,image_url,brand,model,specifications,is_featured,is_active,categories(id,name)").order("created_at",{ascending:false});if(error)throw error;products=data||[];render();}
function render(){
 $("rows").innerHTML=products.map(p=>`<tr><td><strong>${esc(p.name)}</strong></td><td>${esc(p.categories?.name||"Uncategorized")}</td><td>${esc([p.brand,p.model].filter(Boolean).join(" · "))}</td><td><span class="status ${p.is_active?"":"hidden"}">${p.is_active?"Active":"Hidden"}</span></td><td>${p.is_featured?"Yes":"No"}</td><td><button class="action-btn" onclick="editProduct(${p.id})">Edit</button> <button class="action-btn danger" onclick="deleteProduct(${p.id})">Delete</button></td></tr>`).join("")||'<tr><td colspan="6">No products yet.</td></tr>';
}
function openModal(p=null){$("modal").classList.add("open");$("modalTitle").textContent=p?"Edit Product":"Add Product";$("productId").value=p?.id||"";$("name").value=p?.name||"";$("slug").value=p?.slug||"";$("categoryId").value=p?.category_id||"";$("brand").value=p?.brand||"";$("model").value=p?.model||"";$("imageUrl").value=p?.image_url||"";$("description").value=p?.description||"";$("specifications").value=p?.specifications?JSON.stringify(p.specifications,null,2):"";$("featured").checked=!!p?.is_featured;$("active").checked=p?.is_active!==false;}
window.editProduct=id=>openModal(products.find(p=>p.id===id));
window.deleteProduct=async id=>{if(!confirm("Delete this product?"))return;showError("");const {error}=await supabaseClient.from("products").delete().eq("id",id);if(error){showError(error.message);return;}await loadProducts();};
$("addBtn").onclick=()=>openModal();$("cancelBtn").onclick=()=>$("modal").classList.remove("open");$("logout").onclick=async e=>{e.preventDefault();await supabaseClient.auth.signOut();location.href="login.html";};
$("productForm").onsubmit=async e=>{e.preventDefault();showError("");const id=$("productId").value;let specifications={};const raw=$("specifications").value.trim();if(raw){try{specifications=JSON.parse(raw);}catch{showError("Specifications must contain valid JSON.");return;}}const payload={name:$("name").value.trim(),slug:($("slug").value.trim()||slugify($("name").value)),category_id:Number($("categoryId").value),brand:$("brand").value.trim()||null,model:$("model").value.trim()||null,image_url:$("imageUrl").value.trim()||null,description:$("description").value.trim()||null,specifications,is_featured:$("featured").checked,is_active:$("active").checked,updated_at:new Date().toISOString()};if(!payload.name||!payload.category_id){showError("Product name and category are required.");return;}$("saveBtn").disabled=true;$("saveBtn").textContent="Saving...";const result=id?await supabaseClient.from("products").update(payload).eq("id",Number(id)):await supabaseClient.from("products").insert(payload);$("saveBtn").disabled=false;$("saveBtn").textContent="Save Product";if(result.error){showError(result.error.message);return;}$("modal").classList.remove("open");await loadProducts();};
(async()=>{try{if(!await requireSession())return;await loadCategories();await loadProducts();}catch(e){console.error(e);showError("Could not load the admin data. Check your Supabase tables and RLS policies.");}})();
</script></body></html>
