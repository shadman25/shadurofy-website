<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Dashboard | Shad-Urofy</title><link rel="stylesheet" href="../css/style.css"><style>.admin-wrap{padding:55px 0}.dash-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}.dash-head h1{margin:0;font-size:36px}.admin-actions{display:flex;gap:10px}.table-wrap{background:white;border:1px solid #e3eaee;border-radius:16px;overflow:auto}.admin-table{width:100%;border-collapse:collapse;min-width:720px}.admin-table th,.admin-table td{padding:15px 18px;text-align:left;border-bottom:1px solid #e9eef1}.admin-table th{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:#66747d}.status{font-size:12px;font-weight:800;padding:5px 9px;border-radius:20px;background:#e7f7f3;color:#147766}.action-btn{border:1px solid #d9e3e8;background:#fff;padding:7px 10px;border-radius:7px;cursor:pointer}.danger{color:#b42318}.modal{display:none;position:fixed;inset:0;background:rgba(10,20,25,.45);place-items:center;padding:20px}.modal.open{display:grid}.modal-box{width:min(550px,100%);background:#fff;border-radius:18px;padding:28px}.modal-box h2{margin-top:0}.modal-box label{display:block;font-weight:700;margin:12px 0}.modal-box input,.modal-box textarea{margin-top:5px}.check{display:flex!important;align-items:center;gap:8px}.check input{width:auto;margin:0}.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}</style></head>
<body>
<header class="site-header"><div class="container nav"><a class="brand" href="../index.html"><span>SHAD</span>-UROFY</a><nav><a href="../index.html">View Website</a><a href="#" id="logout">Logout</a></nav></div></header>
<main class="admin-wrap"><div class="container"><div class="dash-head"><div><p class="eyebrow">ADMIN PANEL</p><h1>Products</h1></div><div class="admin-actions"><button class="btn primary" id="addBtn">+ Add Product</button></div></div><div class="table-wrap"><table class="admin-table"><thead><tr><th>Product</th><th>Category</th><th>Price</th><th>Status</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div></div></main>
<div class="modal" id="modal"><div class="modal-box"><h2 id="modalTitle">Add Product</h2><form id="productForm"><input id="productId" type="hidden"><label>Product Name<input id="name" required></label><label>Category<input id="category" required></label><label>Price (₹)<input id="price" type="number" min="0" required></label><label>Description<textarea id="description" rows="4" required></textarea></label><label>Two-letter display icon<input id="initials" maxlength="3" placeholder="PR"></label><label class="check"><input id="active" type="checkbox" checked> Active</label><div class="modal-actions"><button type="button" class="btn secondary" id="cancelBtn">Cancel</button><button class="btn primary" type="submit">Save Product</button></div></form></div></div>
<script>
if(sessionStorage.getItem("shadurofy_admin")!=="1") location.href="login.html";
let products=getProducts();
function getProducts(){const d=localStorage.getItem("shadurofy_products");return d?JSON.parse(d):[]}
function save(){localStorage.setItem("shadurofy_products",JSON.stringify(products))}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function render(){document.getElementById("rows").innerHTML=products.map(p=>`<tr><td><strong>${esc(p.name)}</strong></td><td>${esc(p.category)}</td><td>₹${Number(p.price).toLocaleString("en-IN")}</td><td><span class="status">${p.active===false?"Hidden":"Active"}</span></td><td><button class="action-btn" onclick="editProduct(${p.id})">Edit</button> <button class="action-btn danger" onclick="deleteProduct(${p.id})">Delete</button></td></tr>`).join("")||`<tr><td colspan="5">No products yet.</td></tr>`}
function openModal(p=null){document.getElementById("modal").classList.add("open");document.getElementById("modalTitle").textContent=p?"Edit Product":"Add Product";document.getElementById("productId").value=p?.id||"";document.getElementById("name").value=p?.name||"";document.getElementById("category").value=p?.category||"";document.getElementById("price").value=p?.price||"";document.getElementById("description").value=p?.description||"";document.getElementById("initials").value=p?.initials||"";document.getElementById("active").checked=p?.active!==false}
function editProduct(id){openModal(products.find(p=>p.id===id))}
function deleteProduct(id){if(confirm("Delete this product?")){products=products.filter(p=>p.id!==id);save();render()}}
document.getElementById("addBtn").onclick=()=>openModal();document.getElementById("cancelBtn").onclick=()=>document.getElementById("modal").classList.remove("open");
document.getElementById("productForm").onsubmit=e=>{e.preventDefault();const id=document.getElementById("productId").value;const data={id:id?Number(id):Date.now(),name:document.getElementById("name").value.trim(),category:document.getElementById("category").value.trim(),price:Number(document.getElementById("price").value),description:document.getElementById("description").value.trim(),initials:(document.getElementById("initials").value.trim()||document.getElementById("name").value.slice(0,2)).toUpperCase(),active:document.getElementById("active").checked};if(id)products=products.map(p=>p.id===Number(id)?data:p);else products.push(data);save();render();document.getElementById("modal").classList.remove("open")};
document.getElementById("logout").onclick=e=>{e.preventDefault();sessionStorage.removeItem("shadurofy_admin");location.href="login.html"};render();
</script></body></html>
